#!/bin/bash

echo "=========================================="
echo " 🚀 INICIANDO INSTALACIÓN DE BLACK CUBE "
echo "=========================================="

# 1. Variables de configuración (Apunta siempre a la última versión)
GITHUB_URL="https://github.com/Alfredcollie/Sistema_control_eventos/releases/latest/download/Instalador.Black.Cube.dmg"
APP_NAME="ControlEventos.app"
DMG_NAME="BlackCubeTemp.dmg"

# 2. Descargar la aplicación
echo "⬇️ Descargando la última versión del sistema desde GitHub..."
curl -L -o /tmp/$DMG_NAME "$GITHUB_URL"

# 3. Montar el DMG e Instalar en Aplicaciones
echo "📦 Instalando en la carpeta Aplicaciones..."
hdiutil attach /tmp/$DMG_NAME -nobrowse -mountpoint /Volumes/BlackCubeMount
rm -rf "/Applications/$APP_NAME"
cp -R "/Volumes/BlackCubeMount/$APP_NAME" "/Applications/"
hdiutil detach /Volumes/BlackCubeMount -force
rm /tmp/$DMG_NAME

# 4. Inyectar Credenciales en el Llavero
echo "🔐 Configurando seguridad de base de datos..."
echo "Aparecerá una ventana de Mac solicitando tu contraseña de usuario..."

USER_KC="/Users/$(whoami)/Library/Keychains/login.keychain-db"

# 🚀 FIX: Cambiado -a '6543' por -a 'SUPABASE_DB_PORT'
CRED_CMDS="security add-generic-password -a 'SUPABASE_DB_HOST' -s 'ControlEventos' -w 'aws-1-us-west-2.pooler.supabase.com' -U -A '$USER_KC' && security add-generic-password -a 'SUPABASE_DB_PORT' -s 'ControlEventos' -w '6543' -U -A '$USER_KC' && security add-generic-password -a 'SUPABASE_DB_NAME' -s 'ControlEventos' -w 'postgres' -U -A '$USER_KC' && security add-generic-password -a 'SUPABASE_DB_USER' -s 'ControlEventos' -w 'postgres.xqhlkmqiwkeldpcxomhb' -U -A '$USER_KC' && security add-generic-password -a 'SUPABASE_DB_PASSWORD' -s 'ControlEventos' -w 'Fc10339092Fc' -U -A '$USER_KC'"

osascript -e "do shell script \"$CRED_CMDS\" with administrator privileges"

# 5. Quitar el bloqueo de desarrollador no identificado
echo "🔓 Desbloqueando seguridad de Apple..."
xattr -cr "/Applications/$APP_NAME"

# 6. Ejecutar la aplicación
echo "✅ Instalación completada con éxito."
echo "Abriendo Black Cube..."
open "/Applications/$APP_NAME"

echo "Puedes cerrar esta ventana."
exit 0
