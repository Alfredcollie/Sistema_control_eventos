name: 🍏 Constructor de Instalador Mac

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Escribe la versión para el Release (ejemplo: v1.6.0)'
        required: true
        default: 'v1.5.5'

jobs:
  build-mac:
    runs-on: macos-latest
    
    permissions:
      contents: write 

    steps:
    - name: 📥 Clonar tu código desde GitHub
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: 📦 Instalar dependencias y librerías
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install psycopg2-binary customtkinter reportlab keyring

    - name: ☁️ Descargar Rclone (Motor de Nube para Mac)
      run: |
        echo "Descargando el binario oficial de Rclone para Mac..."
        brew install rclone
        cp $(which rclone) .
        chmod +x rclone

    - name: 🏗️ Compilar la Aplicación (Black Cube)
      run: |
        # 🚀 FIX: Se empaqueta Rclone y se asigna el ICONO OFICIAL (.icns)
        pyinstaller --noconfirm --windowed --name "BlackCube" --icon "Ico_Collie_Software.icns" --hidden-import keyring.backends.macOS --add-binary "rclone:." --add-data ".:." control_general.py
        
        echo "Forzando Modo Claro en Info.plist..."
        defaults write "$PWD/dist/BlackCube.app/Contents/Info.plist" NSRequiresAquaSystemAppearance -bool YES
        plutil -convert xml1 "$PWD/dist/BlackCube.app/Contents/Info.plist"

    - name: 📦 Empaquetar en archivo .dmg
      run: |
        echo "Fabricando el disco de instalación..."
        mkdir -p Instalador_Temp
        cp -R "dist/BlackCube.app" Instalador_Temp/
        ln -s /Applications Instalador_Temp/Applications
        hdiutil create -volname "BlackCube" -srcfolder Instalador_Temp -ov -format UDZO "Instalador.Black.Cube.dmg"

    - name: 🚀 Publicar Automáticamente en Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Sistema Black Cube ${{ github.event.inputs.version }}
        body: |
          🚀 **Nueva actualización de Black Cube para Mac**
          - 🎨 FIX: Logotipo oficial de Collie Software integrado en el Dock y aplicación.
          - 🔌 FIX: Conexión segura a Supabase reparada.
          - ☁️ FIX: Motor de sincronización Rclone integrado nativamente.
          - 🔄 FIX: Sistema de Auto-Actualizaciones incorporado.
        files: Instalador.Black.Cube.dmg
        draft: false
        prerelease: false
        make_latest: true
