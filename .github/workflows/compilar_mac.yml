name: 🍏 Constructor de Instalador Mac

on:
  workflow_dispatch: # Esto crea un botón mágico para ejecutarlo cuando tú quieras

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: 📥 Clonar tu código
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Instala tus librerías (Asegúrate de tener un requirements.txt en tu repo)
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Respaldo por si no tienes requirements.txt aún:
        pip install psycopg2-binary customtkinter reportlab keyring

    - name: 🏗️ Compilar la Aplicación
      run: |
        # Aquí le decimos a PyInstaller que convierta tu código en una .app
        # REEMPLAZA 'cotizaciones.py' por tu archivo principal si es distinto
        pyinstaller --windowed --name "ControlEventos" cotizaciones.py

    - name: 📦 Empaquetar en archivo .dmg
      run: |
        echo "Creando la caja del instalador..."
        mkdir -p Instalador_Temp
        cp -R "dist/ControlEventos.app" Instalador_Temp/
        # Creamos el alias a la carpeta de Aplicaciones (El truco de Mac)
        ln -s /Applications Instalador_Temp/Applications
        # Horneamos el DMG
        hdiutil create -volname "BlackCube" -srcfolder Instalador_Temp -ov -format UDZO "Instalador.Black.Cube.dmg"

    - name: 📤 Subir el Instalador Final
      uses: actions/upload-artifact@v4
      with:
        name: Instalador-Mac-BlackCube
        path: Instalador.Black.Cube.dmg
