name: Compilar para macOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14 # Procesador M1 (Apple Silicon)

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilar la aplicación con PyInstaller
      run: |
        # Usamos control_general.py y nombramos la aplicación "ControlFlota"
        pyinstaller --noconfirm --windowed --name "ControlFlota" --add-data "Logo.png:." --add-data "Logo_Collie_Software.png:." --collect-all customtkinter control_general.py

    - name: Comprimir la aplicación (Preservando estructura Mac)
      run: |
        cd dist
        # La letra 'y' preserva la estructura interna para que Mac no la bloquee
        zip -ry ControlFlota-Mac.zip "ControlFlota.app"

    - name: Subir el archivo final
      uses: actions/upload-artifact@v4
      with:
        name: ControlEvento-Mac-APP
        path: dist/ControlEvento-Mac.zip

