name: 🍏 Constructor de Instalador Mac

on:
  workflow_dispatch: # Botón manual para ejecutarlo cuando lo necesites

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: 📥 Clonar tu código desde GitHub
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: 📦 Instalar dependencias y librerías
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Instala dependencias desde tu requirements.txt automáticamente
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Respaldo de seguridad para las librerías críticas
        pip install psycopg2-binary customtkinter reportlab keyring

    - name: 🏗️ Compilar la Aplicación (Black Cube)
      run: |
        # Inicia desde control_general.py (esto jala todos tus otros .py automáticamente)
        # --add-data ".:." empaca tus logos, json y recursos gráficos.
        pyinstaller --windowed --name "ControlEventos" --add-data ".:." control_general.py

    - name: 📦 Empaquetar en archivo .dmg
      run: |
        echo "Fabricando el disco de instalación..."
        mkdir -p Instalador_Temp
        cp -R "dist/ControlEventos.app" Instalador_Temp/
        # Creamos el acceso directo a Aplicaciones para el instalador
        ln -s /Applications Instalador_Temp/Applications
        # Horneamos el DMG final
        hdiutil create -volname "BlackCube" -srcfolder Instalador_Temp -ov -format UDZO "Instalador.Black.Cube.dmg"

    - name: 📤 Entregar el Instalador Final
      uses: actions/upload-artifact@v4
      with:
        name: Instalador-Mac-BlackCube
        path: Instalador.Black.Cube.dmg
