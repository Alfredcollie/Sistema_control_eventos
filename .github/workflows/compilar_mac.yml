name: Compilar para Mac M1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14 # macos-14 usa arquitectura nativa ARM64 (Apple Silicon M1/M2/M3)

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'arm64' # Aseguramos que instale la versión de Python para M1

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilar la aplicación con PyInstaller
      run: |
        # ATENCIÓN: En Mac el separador de --add-data es dos puntos (:) no punto y coma (;)
        # Nombramos la salida como "ControlEventos"
        pyinstaller --noconfirm --windowed --name "ControlEventos" --add-data "Logo.png:." --add-data "Logo_Collie_Software.png:." --collect-all customtkinter control_general.py

    - name: Comprimir la aplicación (.app a .zip)
      run: |
        # Mac genera una carpeta .app, la comprimimos para poder descargarla
        cd dist
        zip -r ControlEventos-Mac.zip ControlEventos.app/

    - name: Subir Instalador a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Ejecutable-ControlEventos-Mac-M1
        path: dist/ControlEventos-Mac.zip
